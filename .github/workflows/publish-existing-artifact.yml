name: Publish Existing XR1710G and W1701K Artifacts

run-name: Publish U-Boot run ${{ inputs.run_id }} as ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful XR1710G and W1701K build on main
        required: true
        type: string
      tag:
        description: Existing main tag in YYYYMMDD format, dated in Asia/Shanghai
        required: true
        type: string
      release_type:
        description: Release channel
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_REPO: ${{ github.repository }}

permissions:
  actions: read
  contents: write

concurrency:
  group: xr1710g-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify the source run and release tag
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The build run ID must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]{8}$ ]] ||
             [ "$RELEASE_TAG" != "$(TZ=Asia/Shanghai date +%Y%m%d)" ]; then
            echo "The tag must be today's YYYYMMDD date in Asia/Shanghai." >&2
            exit 1
          fi

          RUN=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}")
          SOURCE_SHA=$(jq -er --arg repo "$GH_REPO" '
            select(.conclusion == "success" and .path == ".github/workflows/build.yml" and
              .head_repository.full_name == $repo and .head_branch == "main")
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ' <<<"$RUN")

          REF_API="repos/${GH_REPO}/git"
          TAG_OBJECT=$(gh api "$REF_API/ref/tags/$RELEASE_TAG" --jq '.object')
          if [ "$(jq -r '.type' <<<"$TAG_OBJECT")" = tag ]; then
            TAG_SHA=$(jq -er '.sha' <<<"$TAG_OBJECT")
            TAG_OBJECT=$(gh api "$REF_API/tags/$TAG_SHA" --jq '.object')
          fi
          TARGET_SHA=$(jq -er 'select(.type == "commit") | .sha' <<<"$TAG_OBJECT")
          test "$TARGET_SHA" = "$SOURCE_SHA"
          MAIN_ANCESTOR=$(gh api "repos/${GH_REPO}/compare/${SOURCE_SHA}...main" --jq '.merge_base_commit.sha')
          test "$MAIN_ANCESTOR" = "$SOURCE_SHA"
          echo "commit=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download both model builds
        uses: actions/download-artifact@v8
        with:
          pattern: uboot-*
          path: build-output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Verify the two slots and publish one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$(TZ=Asia/Shanghai date +%Y%m%d)" ]; then
            echo "The publication date changed during this run." >&2
            exit 1
          fi
          mkdir release-output
          for board in xr1710g w1701k; do
            (
              cd "build-output/uboot-$board"
              info="$board-build-info.txt"
              test "$(sed -n 's/^Build target: //p' "$info")" = "$board"
              test "$(sed -n 's/^Commit: //p' "$info")" = "$SOURCE_SHA"
              stamp=$(sed -n 's/^Build stamp (UTC): //p' "$info")
              [[ "$stamp" =~ ^[0-9]{8}-[0-9]{6}$ ]]
              slot="$board-chainloader-${stamp}-g${SOURCE_SHA:0:12}-slot.bin"
              test "$(sed -n 's/^Flash slot image: //p' "$info")" = "$slot"
              size=$(wc -c < "$slot")
              test "$size" -gt $((0x2104))
              test "$size" -lt $((0x100000))
              test "$(od -An -tx1 -N4 "$slot" | tr -d ' \n')" = 27051956
              test "$(od -An -tx1 -j $((0x2100)) -N4 "$slot" | tr -d ' \n')" = d00dfeed
              files=("$slot")
              if [ "$board" = w1701k ]; then
                test "$(od -An -tx1 -j $((0xf0000)) -N4 "$slot" | tr -d ' \n')" = 27051956
                test -s W1701K-EN8811H-LICENSE.txt
                files+=(W1701K-EN8811H-LICENSE.txt)
              fi
              sha256sum "${files[@]}" | cmp - "$board-sha256sums.txt"
              cp "${files[@]}" "$info" ../../release-output/
            )
          done
          cd release-output
          sha256sum * > SHA256SUMS

          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          {
            # Backticks are literal Markdown in the release text.
            # shellcheck disable=SC2016
            printf 'XR1710G and W1701K standard slots built from [`%s`](%s/%s/commit/%s) in [Actions run %s](%s/%s/actions/runs/%s).\n\n' \
              "${SOURCE_SHA:0:12}" "$GITHUB_SERVER_URL" "$GH_REPO" "$SOURCE_SHA" \
              "$RUN_ID" "$GITHUB_SERVER_URL" "$GH_REPO" "$RUN_ID"
            # shellcheck disable=SC2016
            printf 'Choose the slot for your device and an [installation method that accepts it](%s/%s/blob/%s/docs/recovery-web.md). Verify with `SHA256SUMS` and check [compatible slot formats](%s/%s/blob/%s/docs/build-compatibility-slots.md) for other uploaders.\n\n' \
              "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_TAG"
            printf '%s\n' 'W1701K provides DHCP and web recovery on both Ethernet ports. Its slot includes EN8811H PHY firmware and ships with the Airoha license.'
            printf '\n%s\n' 'For new installations, we recommend the matching [Full ImmortalWrt firmware](https://github.com/DictXiong/ImmortalWrt-for-Gemtek-brightspeed/releases). Existing compatible firmware may be used independently.'
          } > "$NOTES_FILE"

          case "$RELEASE_TYPE" in
            pre-release) FLAGS=(--prerelease --latest=false) ;;
            release) FLAGS=(--latest) ;;
            *) exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" ./* \
            --verify-tag --title "XR1710G and W1701K Secondary U-Boot $RELEASE_TAG" \
            --notes-file "$NOTES_FILE" "${FLAGS[@]}"
