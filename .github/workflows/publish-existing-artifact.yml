name: Publish Existing XR1710G Artifact

run-name: Publish XR1710G run ${{ inputs.run_id }} as ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful XR1710G build on main
        required: true
        type: string
      tag:
        description: Existing main tag in YYYYMMDD format, dated in Asia/Shanghai
        required: true
        type: string
      release_type:
        description: Release channel
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_REPO: ${{ github.repository }}

permissions:
  actions: read
  contents: write

concurrency:
  group: xr1710g-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify the source run and release tag
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The build run ID must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]{8}$ ]] ||
             [ "$RELEASE_TAG" != "$(TZ=Asia/Shanghai date +%Y%m%d)" ]; then
            echo "The tag must be today's YYYYMMDD date in Asia/Shanghai." >&2
            exit 1
          fi

          RUN=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}")
          SOURCE_SHA=$(jq -er --arg repo "$GH_REPO" '
            select(.conclusion == "success" and .path == ".github/workflows/build.yml" and
              .head_repository.full_name == $repo and .head_branch == "main")
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ' <<<"$RUN")

          REF_API="repos/${GH_REPO}/git"
          TAG_OBJECT=$(gh api "$REF_API/ref/tags/$RELEASE_TAG" --jq '.object')
          if [ "$(jq -r '.type' <<<"$TAG_OBJECT")" = tag ]; then
            TAG_SHA=$(jq -er '.sha' <<<"$TAG_OBJECT")
            TAG_OBJECT=$(gh api "$REF_API/tags/$TAG_SHA" --jq '.object')
          fi
          TARGET_SHA=$(jq -er 'select(.type == "commit") | .sha' <<<"$TAG_OBJECT")
          test "$TARGET_SHA" = "$SOURCE_SHA"
          MAIN_ANCESTOR=$(gh api "repos/${GH_REPO}/compare/${SOURCE_SHA}...main" --jq '.merge_base_commit.sha')
          test "$MAIN_ANCESTOR" = "$SOURCE_SHA"
          echo "commit=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the XR1710G build
        uses: actions/download-artifact@v8
        with:
          name: uboot-xr1710g
          path: release-output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Verify the slot and publish a new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$(TZ=Asia/Shanghai date +%Y%m%d)" ]; then
            echo "The publication date changed during this run." >&2
            exit 1
          fi
          cd release-output
          INFO=xr1710g-build-info.txt
          test "$(sed -n 's/^Build target: //p' "$INFO")" = xr1710g
          test "$(sed -n 's/^Commit: //p' "$INFO")" = "$SOURCE_SHA"
          STAMP=$(sed -n 's/^Build stamp (UTC): //p' "$INFO")
          [[ "$STAMP" =~ ^[0-9]{8}-[0-9]{6}$ ]]
          SLOT="xr1710g-chainloader-${STAMP}-g${SOURCE_SHA:0:12}-slot.bin"
          test "$(sed -n 's/^Flash slot image: //p' "$INFO")" = "$SLOT"
          SIZE=$(wc -c < "$SLOT")
          test "$SIZE" -gt $((0x2104))
          test "$SIZE" -lt $((0x100000))
          test "$(od -An -tx1 -N4 "$SLOT" | tr -d ' \n')" = 27051956
          test "$(od -An -tx1 -j $((0x2100)) -N4 "$SLOT" | tr -d ' \n')" = d00dfeed
          sha256sum "$SLOT" > SHA256SUMS
          cmp SHA256SUMS xr1710g-sha256sums.txt

          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          {
            # Backticks are literal Markdown in the release text.
            # shellcheck disable=SC2016
            printf 'XR1710G standard slot built from [`%s`](%s/%s/commit/%s) in [Actions run %s](%s/%s/actions/runs/%s).\n\n' \
              "${SOURCE_SHA:0:12}" "$GITHUB_SERVER_URL" "$GH_REPO" "$SOURCE_SHA" \
              "$RUN_ID" "$GITHUB_SERVER_URL" "$GH_REPO" "$RUN_ID"
            # shellcheck disable=SC2016
            printf 'Use this slot with an [installation method that accepts the standard slot](%s/%s/blob/%s/docs/recovery-web.md), and verify it with `SHA256SUMS`. Check [compatible slot formats](%s/%s/blob/%s/docs/build-compatibility-slots.md) for other uploaders.\n' \
              "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_TAG"
          } > "$NOTES_FILE"

          case "$RELEASE_TYPE" in
            pre-release) FLAGS=(--prerelease --latest=false) ;;
            release) FLAGS=(--latest) ;;
            *) exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" "$SLOT" SHA256SUMS \
            --verify-tag --title "XR1710G Secondary U-Boot $RELEASE_TAG" \
            --notes-file "$NOTES_FILE" "${FLAGS[@]}"
